# PerroniPhone — Configuración de nginx
# Sirve el "front controller" de Laravel (public/index.php) y le pasa
# las peticiones .php al contenedor de PHP-FPM (app:9000).
server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    index index.html index.php;

    # Sube el límite por si en el futuro suben archivos (fotos de perfil, etc.)
    client_max_body_size 20M;

    location / {
        # Laravel resuelve todas las rutas a través de index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # No exponer archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}