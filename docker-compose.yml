version: "3.8"

# PerroniPhone — Docker Compose
# Tres contenedores, tal como pide la documentación del proyecto:
#   nginx  -> recibe las peticiones HTTP y las reenvía a Laravel (PHP-FPM)
#   app    -> Laravel (la API, equivalente a lo que antes era ASP.NET Core)
#   mysql  -> la base de datos (equivalente a lo que antes era SQL Server)
services:

  nginx:
    image: nginx:1.27-alpine
    container_name: perroniphone_nginx
    ports:
      - "8080:80"          # http://localhost:8080  <- por aquí se accede a la API
    volumes:
      - laravel_app_data:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - perroniphone_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perroniphone_app
    volumes:
      - laravel_app_data:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: perroniphone_db
      DB_USERNAME: perroniphone_user
      DB_PASSWORD: perroniphone_pass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - perroniphone_net

  mysql:
    image: mysql:8.0
    container_name: perroniphone_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: perroniphone_db
      MYSQL_USER: perroniphone_user
      MYSQL_PASSWORD: perroniphone_pass
      MYSQL_ROOT_PASSWORD: perroniphone_root_pass
    ports:
      - "3307:3306"         # 3307 en tu máquina -> 3306 dentro del contenedor
                             # (evita chocar con un MySQL que ya tengas instalado)
    volumes:
      - perroniphone_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pperroniphone_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - perroniphone_net

  # Interfaz web para ver/editar la base de datos, como hacían con SSMS.
  # Entrando a http://localhost:8081 (usuario: perroniphone_user / perroniphone_pass,
  # o root / perroniphone_root_pass para ver todo).
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: perroniphone_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - perroniphone_net

volumes:
  perroniphone_mysql_data:
  laravel_app_data:

networks:
  perroniphone_net:
    driver: bridge
