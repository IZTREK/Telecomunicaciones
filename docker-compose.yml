# PerroniPhone — Docker Compose
# Cuatro contenedores:
#   nginx      -> sirve el frontend (laravel-app/public) y reenvía /api/* a Laravel
#   app        -> Laravel (PHP-FPM): la API
#   mysql      -> la base de datos
#   phpmyadmin -> interfaz web para ver/editar la base
services:

  nginx:
    image: nginx:1.27-alpine
    container_name: perroniphone_nginx
    ports:
      - "8080:80"            # http://localhost:8080  <- portal + API
    volumes:
      # El frontend se monta directo del repo: cambios en HTML/CSS/JS se ven
      # al recargar el navegador, sin reconstruir nada.
      - ./laravel-app/public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - perroniphone_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perroniphone_app
    # Si el arranque falla (p. ej. MySQL aún no acepta conexiones) se
    # reintenta solo, en lugar de quedar apagado y que nginx responda 502.
    restart: unless-stopped
    # Sin volumen a propósito: el código PHP vive dentro de la imagen, así
    # que "docker compose up -d --build" siempre corre la versión actual.
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: perroniphone_db
      DB_USERNAME: perroniphone_user
      DB_PASSWORD: perroniphone_pass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - perroniphone_net

  mysql:
    image: mysql:8.0
    container_name: perroniphone_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: perroniphone_db
      MYSQL_USER: perroniphone_user
      MYSQL_PASSWORD: perroniphone_pass
      MYSQL_ROOT_PASSWORD: perroniphone_root_pass
    ports:
      # Solo desde tu propia máquina (127.0.0.1): nadie más en la red ni un
      # túnel de ngrok puede llegar a la base directamente.
      - "127.0.0.1:3307:3306"
    volumes:
      - perroniphone_mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) y no "localhost" (socket): en el primer arranque MySQL
      # levanta un servidor temporal sin red; por socket ya responde "vivo"
      # y Laravel intentaría migrar antes de que el puerto 3306 exista.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pperroniphone_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - perroniphone_net

  # http://localhost:8081 (perroniphone_user / perroniphone_pass,
  # o root / perroniphone_root_pass para ver todo). Solo desde tu máquina.
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: perroniphone_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - perroniphone_net

volumes:
  perroniphone_mysql_data:

networks:
  perroniphone_net:
    driver: bridge
